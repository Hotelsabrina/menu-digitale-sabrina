<script>
  document.getElementById("step2").addEventListener("submit", async function (e) {
    e.preventDefault();

    const getValue = id => document.getElementById(id)?.value || "";

    const dati = {
      cognome: getValue("cognome"),
      camera: getValue("camera"),
      persone: getValue("persone"),
      primi_pranzo: getValue("primoPranzo"),
      secondi_pranzo: getValue("secondoPranzo"),
      contorni_pranzo: getValue("contornoPranzo"),
      dessert_pranzo: getValue("dessertPranzo"),
      extra_pranzo: getValue("extraPranzo"),
      primi_cena: getValue("primoCena"),
      secondi_cena: getValue("secondoCena"),
      contorni_cena: getValue("contornoCena"),
      dessert_cena: getValue("dessertCena"),
      extra: getValue("extra"),
      esigenze: [...document.querySelectorAll('input[name="esigenze"]:checked')].map(e => e.value).join(", ")
    };

    try {
      const response = await fetch("LINK_TUO_SCRIPT_MAIL", {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams(dati)
      });

      document.getElementById("step2").classList.add("hidden");
      document.getElementById("successMessage").style.display = "block";

    } catch (err) {
      alert("Errore durante l'invio del menù.");
      console.error(err);
    }
  });
</script>
