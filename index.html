<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Menù del Giorno - Hotel Sabrina</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #fef9f5;
      padding: 30px;
      color: #333;
    }

    h1 {
      text-align: center;
      color: #003366;
      margin-bottom: 30px;
    }

    h2 {
      font-size: 22px;
      color: #003366;
      margin-top: 40px;
      margin-bottom: 10px;
    }

    hr {
      border: none;
      border-top: 2px solid #ccc;
      margin-bottom: 20px;
    }

    label {
      font-weight: bold;
      display: block;
      margin-top: 15px;
    }

    select, input[type="text"], input[type="number"] {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background-color: #fff;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    button {
      margin-top: 30px;
      background-color: #003366;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background-color: #005599;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Menù del Giorno</h1>

    <!-- Info cliente -->
    <label for="cognome">Cognome</label>
    <input type="text" id="cognome" name="cognome" placeholder="Inserisci il cognome">

    <label for="camera">Numero della camera</label>
    <input type="number" id="camera" name="camera" placeholder="Es. 203">

    <label for="persone">Numero di persone</label>
    <input type="number" id="persone" name="persone" placeholder="Es. 2">

    <!-- Sezione PRANZO -->
    <h2>🍽️ Menù Pranzo</h2>
    <hr>

    <label for="primoPranzo">Primi Pranzo</label>
    <select id="primoPranzo" name="primoPranzo">
      <option value="">Seleziona un primo</option>
      <option>Spaghetti alle vongole</option>
      <option>Lasagne</option>
      <option>Risotto ai funghi</option>
    </select>

    <label for="secondoPranzo">Secondi Pranzo</label>
    <select id="secondoPranzo" name="secondoPranzo">
      <option value="">Seleziona un secondo</option>
      <option>Pollo arrosto</option>
      <option>Frittura mista</option>
      <option>Scaloppine al limone</option>
    </select>

    <label for="contornoPranzo">Contorni Pranzo</label>
    <select id="contornoPranzo" name="contornoPranzo">
      <option value="">Seleziona un contorno</option>
      <option>Patate al forno</option>
      <option>Insalata</option>
      <option>Verdure grigliate</option>
    </select>

    <label for="dessertPranzo">Dessert Pranzo</label>
    <select id="dessertPranzo" name="dessertPranzo">
      <option value="">Seleziona un dessert</option>
      <option>Macedonia</option>
      <option>Tiramisù</option>
      <option>Panna cotta</option>
    </select>

    <!-- Sezione CENA -->
    <h2>🌙 Menù Cena</h2>
    <hr>

    <label for="primoCena">Primi Cena</label>
    <select id="primoCena" name="primoCena">
      <option value="">Seleziona un primo</option>
      <option>Pasta al pesto</option>
      <option>Ravioli burro e salvia</option>
      <option>Minestrone</option>
    </select>

    <label for="secondoCena">Secondi Cena</label>
    <select id="secondoCena" name="secondoCena">
      <option value="">Seleziona un secondo</option>
      <option>Filetto di branzino</option>
      <option>Bistecca</option>
      <option>Polpette al sugo</option>
    </select>

    <label for="contornoCena">Contorni Cena</label>
    <select id="contornoCena" name="contornoCena">
      <option value="">Seleziona un contorno</option>
      <option>Purè di patate</option>
      <option>Carote lesse</option>
      <option>Insalata mista</option>
    </select>

    <label for="dessertCena">Dessert Cena</label>
    <select id="dessertCena" name="dessertCena">
      <option value="">Seleziona un dessert</option>
      <option>Gelato</option>
      <option>Crostata</option>
      <option>Frutta fresca</option>
    </select>

    <button type="submit">Invia Menù</button>
  </div>
</body>
</html>
