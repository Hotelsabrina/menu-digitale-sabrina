<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Menù del Giorno - Hotel Sabrina</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #fdf5e6;
      margin: 0;
      padding: 0;
    }

    .wrapper {
      max-width: 700px;
      margin: 40px auto;
      background: white;
      border-radius: 10px;
      padding: 30px;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    header img {
      height: 80px;
    }

    h1, h2 {
      text-align: center;
      color: #003366;
    }

    hr {
      border: none;
      border-top: 2px solid #ccc;
      margin: 20px 0;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input, select, textarea, button {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 5px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      background-color: #003366;
      color: white;
      border: none;
      margin-top: 30px;
      cursor: pointer;
      font-size: 18px;
    }

    button:hover {
      background-color: #005599;
    }

    .hidden {
      display: none;
    }

    #successMessage {
      display: none;
      margin-top: 20px;
      color: green;
      text-align: center;
      font-weight: bold;
    }

    .checkbox-group label {
      display: block;
      font-weight: normal;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <header>
      <img src="https://www.hotelsabrinaonline.it/wp-content/uploads/2022/06/Logo-Hotel-Sabrina-50-anni-2022-01.png" alt="Hotel Sabrina">
    </header>

    <h1>Menù del Giorno</h1>

    <!-- STEP 1: Info Utente -->
    <div id="step1">
      <label for="cognome">Cognome</label>
      <input type="text" id="cognome" placeholder="Inserisci il cognome">

      <label for="camera">Numero della camera</label>
      <input type="number" id="camera" placeholder="Es. 203">

      <label for="persone">Numero di persone</label>
      <input type="number" id="persone" placeholder="Es. 2">

      <button onclick="proseguiStep2()">Accedi al Menù</button>
    </div>

    <!-- STEP 2: Menù -->
    <form id="step2" class="hidden">
      <h2>🍽️ Menù Pranzo</h2>
      <hr>

      <label for="primoPranzo">Primi Pranzo</label>
      <select id="primoPranzo" name="primoPranzo"></select>

      <label for="secondoPranzo">Secondi Pranzo</label>
      <select id="secondoPranzo" name="secondoPranzo"></select>

      <label for="contornoPranzo">Contorni Pranzo</label>
      <select id="contornoPranzo" name="contornoPranzo"></select>

      <label for="dessertPranzo">Dessert Pranzo</label>
      <select id="dessertPranzo" name="dessertPranzo"></select>

      <h2>🌙 Menù Cena</h2>
      <hr>

      <label for="primoCena">Primi Cena</label>
      <select id="primoCena" name="primoCena"></select>

      <label for="secondoCena">Secondi Cena</label>
      <select id="secondoCena" name="secondoCena"></select>

      <label for="contornoCena">Contorni Cena</label>
      <select id="contornoCena" name="contornoCena"></select>

      <label for="dessertCena">Dessert Cena</label>
      <select id="dessertCena" name="dessertCena"></select>

      <label for="extra">Piatti extra o richieste particolari</label>
      <textarea id="extra" name="extra" rows="3" placeholder="Scrivi qui eventuali richieste..."></textarea>

      <label>Esigenze alimentari</label>
      <div class="checkbox-group">
        <label><input type="checkbox" name="esigenze" value="Celiachia"> Celiachia</label>
        <label><input type="checkbox" name="esigenze" value="Intolleranze"> Intolleranze</label>
        <label><input type="checkbox" name="esigenze" value="Vegetariano"> Vegetariano</label>
        <label><input type="checkbox" name="esigenze" value="Vegano"> Vegano</label>
        <label><input type="checkbox" name="esigenze" value="Altro"> Altro</label>
      </div>

      <button type="submit">Invia il Menù</button>
    </form>

    <div id="successMessage">
      ✅ Il menù è stato inviato con successo! Grazie 😊
    </div>
  </div>

  <script>
    function proseguiStep2() {
      const cognome = document.getElementById('cognome').value.trim();
      const camera = document.getElementById('camera').value.trim();
      const persone = document.getElementById('persone').value.trim();

      if (!cognome || !camera || !persone) {
        alert("Compila tutti i campi prima di proseguire.");
        return;
      }

      document.getElementById('step1').classList.add('hidden');
      document.getElementById('step2').classList.remove('hidden');
    }

    document.getElementById("step2").addEventListener("submit", function (e) {
      e.preventDefault();

      // Messaggio di successo simulato (integra qui invio a Google Apps Script se vuoi)
      document.getElementById("successMessage").style.display = "block";
      document.getElementById("step2").classList.add("hidden");
    });

    window.addEventListener("DOMContentLoaded", async () => {
      const url = "https://script.google.com/macros/s/AKfycbzokUc-Gnc9D9LmcC-MsLj1DxTgla-w7haZed7kdD2icKo9JE79LyRD13_YJ6Zc_hmb/exec";

      try {
        const response = await fetch(url);
        const dati = await response.json();

        if (dati.errore) {
          alert("⚠️ Menù non trovato: " + dati.errore);
          return;
        }

        const riempiSelect = (id, valori) => {
          const select = document.getElementById(id);
          select.innerHTML = '<option value="">Seleziona...</option>';
          valori.forEach(piatto => {
            const opt = document.createElement("option");
            opt.value = piatto;
            opt.textContent = piatto;
            select.appendChild(opt);
          });
        };

        riempiSelect("primoPranzo", dati.primiPranzo);
        riempiSelect("secondoPranzo", dati.secondiPranzo);
        riempiSelect("contornoPranzo", dati.contorniPranzo);
        riempiSelect("dessertPranzo", dati.dessertPranzo);
        riempiSelect("primoCena", dati.primiCena);
        riempiSelect("secondoCena", dati.secondiCena);
        riempiSelect("contornoCena", dati.contorniCena);
        riempiSelect("dessertCena", dati.dessertCena);
      } catch (err) {
        alert("Errore durante il caricamento del menù del giorno.");
        console.error(err);
      }
    });
  </script>
</body>
</html>
