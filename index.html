<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menù del Giorno - Hotel Sabrina</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #fdf6ed;
      margin: 0;
      padding: 0;
      color: #333;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 2rem;
    }

    .logo {
      display: block;
      max-width: 250px;
      margin: 1rem auto 2rem;
    }

    h1 {
      text-align: center;
      color: #2c4a7a;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    label {
      font-weight: bold;
    }

    input, select, textarea {
      padding: 0.7rem;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    textarea {
      resize: vertical;
    }

    button {
      background-color: #2c4a7a;
      color: white;
      padding: 0.9rem;
      font-size: 1rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background-color: #1b2f5b;
    }

    @media (max-width: 600px) {
      .container {
        padding: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="https://www.hotelsabrinaonline.it/wp-content/uploads/2022/06/Logo-Hotel-Sabrina-50-anni-2022-01.png" alt="Logo Hotel Sabrina" class="logo" />
    <h1>Menù del Giorno</h1>

    <form id="menuForm">
      <label>Numero Camera:</label>
      <input type="number" name="camera" required />

      <label>Numero Persone:</label>
      <input type="number" name="persone" required />

      <label>Cognome:</label>
      <input type="text" name="cognome" required />

      <label>Primi (Pranzo):</label>
      <input type="text" name="primi_pranzo" />

      <label>Secondi (Pranzo):</label>
      <input type="text" name="secondi_pranzo" />

      <label>Contorni (Pranzo):</label>
      <input type="text" name="contorni_pranzo" />

      <label>Dessert (Pranzo):</label>
      <input type="text" name="dessert_pranzo" />

      <label>Primi (Cena):</label>
      <input type="text" name="primi_cena" />

      <label>Secondi (Cena):</label>
      <input type="text" name="secondi_cena" />

      <label>Contorni (Cena):</label>
      <input type="text" name="contorni_cena" />

      <label>Dessert (Cena):</label>
      <input type="text" name="dessert_cena" />

      <label>Richieste particolari / Piatti extra:</label>
      <textarea name="extra" rows="3"></textarea>

      <label>Esigenze alimentari:</label>
      <label><input type="checkbox" name="esigenze" value="Celiaco" /> Celiaco</label>
      <label><input type="checkbox" name="esigenze" value="Vegetariano" /> Vegetariano</label>
      <label><input type="checkbox" name="esigenze" value="Lattosio" /> Intolleranza al lattosio</label>

      <p><strong>📞 Dalla vostra camera chiamare il numero 253 per parlare direttamente con la cucina.</strong></p>

      <button type="submit">Invia Menù</button>
    </form>
  </div>

  <script>
    document.getElementById("menuForm").addEventListener("submit", function (e) {
      e.preventDefault();
      alert("Menù inviato con successo! Grazie.");
      // Qui potremo collegare il salvataggio su Google Sheet + invio mail/telegram
    });
  </script>
</body>
</html>
